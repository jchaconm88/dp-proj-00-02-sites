name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string
      staging_run_id:
        description: 'Staging workflow run ID to promote'
        required: false
        type: string

env:
  PHP_VERSION: '8.1'

jobs:
  verify-approval:
    name: Verify Manual Approval
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "deploy" ]; then
            echo "❌ Deployment not confirmed. You must type 'deploy' to proceed."
            exit 1
          fi
          echo "✓ Deployment confirmed by ${{ github.actor }}"

      - name: Check staging health before promoting
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_URL }}")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Staging site is not healthy (HTTP $STATUS). Fix staging before deploying to production."
            exit 1
          fi
          echo "✓ Staging is healthy. Proceeding with production deployment."

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: verify-approval
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package for production
        run: |
          for CLIENT_DIR in front/ecommerce/*/; do
            CLIENT_NAME=$(basename "$CLIENT_DIR")
            if [ -d "${CLIENT_DIR}wp-content/themes" ]; then
              cd "${CLIENT_DIR}wp-content/themes"
              for THEME_DIR in */; do
                THEME_NAME=$(basename "$THEME_DIR")
                zip -r "../../../../${CLIENT_NAME}-${THEME_NAME}.zip" "$THEME_DIR" -x "*/node_modules/*" "*/.git/*" "*/tests/*" "*/.env*"
              done
              cd -
            fi
            if [ -d "${CLIENT_DIR}wp-content/plugins" ]; then
              cd "${CLIENT_DIR}wp-content/plugins"
              for PLUGIN_DIR in */; do
                PLUGIN_NAME=$(basename "$PLUGIN_DIR")
                zip -r "../../../../${CLIENT_NAME}-${PLUGIN_NAME}.zip" "$PLUGIN_DIR" -x "*/node_modules/*" "*/.git/*" "*/vendor/*" "*/tests/*"
              done
              cd -
            fi
          done

      - name: Create backup on production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            BACKUP_DIR="${{ secrets.PRODUCTION_BACKUP_PATH }}/$(date +%Y%m%d%H%M%S)"
            mkdir -p "$BACKUP_DIR"
            
            # Backup current wp-content (themes + plugins only)
            cp -r "${{ secrets.PRODUCTION_WP_PATH }}/wp-content/themes" "$BACKUP_DIR/"
            cp -r "${{ secrets.PRODUCTION_WP_PATH }}/wp-content/plugins" "$BACKUP_DIR/"
            
            # Keep only last 5 backups
            cd "${{ secrets.PRODUCTION_BACKUP_PATH }}" && ls -dt */ | tail -n +6 | xargs rm -rf || true
            
            echo "✓ Backup created at $BACKUP_DIR"

      - name: Deploy to production via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          ssh_private_key: ${{ secrets.PRODUCTION_SSH_KEY }}
          local_path: './*.zip'
          remote_path: ${{ secrets.PRODUCTION_DEPLOY_PATH }}/releases/
          sftp_only: true

      - name: Extract and activate on production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd ${{ secrets.PRODUCTION_DEPLOY_PATH }}
            RELEASE_DIR="releases/$(date +%Y%m%d%H%M%S)"
            mkdir -p "$RELEASE_DIR"
            
            # Extract ZIPs
            for ZIP in releases/*.zip; do
              unzip -o "$ZIP" -d "$RELEASE_DIR/"
            done
            
            # Enable maintenance mode
            wp maintenance-mode activate --path="${{ secrets.PRODUCTION_WP_PATH }}" || true
            
            # Sync files
            rsync -avz --delete "$RELEASE_DIR/" "${{ secrets.PRODUCTION_WP_PATH }}/wp-content/"
            
            # Clear all caches
            wp cache flush --path="${{ secrets.PRODUCTION_WP_PATH }}" || true
            wp transient delete --all --path="${{ secrets.PRODUCTION_WP_PATH }}" || true
            
            # Disable maintenance mode
            wp maintenance-mode deactivate --path="${{ secrets.PRODUCTION_WP_PATH }}" || true
            
            # Clean up old releases
            cd releases && ls -dt */ | tail -n +6 | xargs rm -rf || true

  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - name: Wait for deployment to settle
        run: sleep 15

      - name: Check production site responds
        run: |
          TIMEOUT=30
          START=$(date +%s)
          while true; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PRODUCTION_URL }}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Production site is healthy (HTTP 200)"
              exit 0
            fi
            
            ELAPSED=$(( $(date +%s) - START ))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "✗ Health check failed after ${TIMEOUT}s (last status: $STATUS)"
              echo "⚠️ ROLLBACK MAY BE REQUIRED"
              exit 1
            fi
            
            echo "Waiting... (status: $STATUS, elapsed: ${ELAPSED}s)"
            sleep 5
          done

      - name: Verify critical pages
        run: |
          PAGES=("/" "/tienda/" "/mi-cuenta/" "/carrito/")
          FAILED=0
          
          for PAGE in "${PAGES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PRODUCTION_URL }}${PAGE}")
            if [ "$STATUS" = "200" ]; then
              echo "✓ ${PAGE} - OK"
            else
              echo "✗ ${PAGE} - HTTP ${STATUS}"
              FAILED=$((FAILED + 1))
            fi
          done
          
          if [ $FAILED -gt 0 ]; then
            echo "⚠️ ${FAILED} page(s) failed health check"
            exit 1
          fi

  notify:
    name: Notify Deployment Result
    runs-on: ubuntu-latest
    needs: [deploy-production, health-check]
    if: always()
    steps:
      - name: Send notification
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "${{ needs.health-check.result == 'success' && '✅ Production deployment successful' || '❌ Production deployment failed' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.health-check.result == 'success' && '✅' || '❌' }} *Production Deployment ${{ needs.health-check.result == 'success' && 'Successful' || 'Failed' }}*\n\n*Deployed by:* ${{ github.actor }}\n*Commit:* `${{ github.sha }}`\n*Time:* ${{ github.event.head_commit.timestamp || 'manual trigger' }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
