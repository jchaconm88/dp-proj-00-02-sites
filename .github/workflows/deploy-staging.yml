name: Deploy to Staging

on:
  push:
    branches:
      - main
    paths:
      - 'front/**'

env:
  PHP_VERSION: '8.1'
  NODE_VERSION: '18'

jobs:
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer, cs2pr
          extensions: mbstring, xml, curl

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: front

      - name: Run PHP_CodeSniffer
        run: |
          composer global require squizlabs/php_codesniffer
          composer global require phpcompatibility/php-compatibility
          phpcs --config-set installed_paths $(composer global config home)/vendor/phpcompatibility/php-compatibility
          phpcs --standard=WordPress --extensions=php --ignore=*/vendor/* front/
          phpcs --standard=PHPCompatibility --runtime-set testVersion 8.1- --extensions=php --ignore=*/vendor/* front/
        continue-on-error: false

      - name: Check PHP syntax
        run: find front/ -name "*.php" -exec php -l {} \; | grep -v "No syntax errors"
        continue-on-error: false

  package:
    name: Package Theme & Plugins
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed clients
        id: detect-clients
        run: |
          CHANGED_CLIENTS=$(git diff --name-only HEAD~1 HEAD -- front/ecommerce/ | cut -d'/' -f3 | sort -u | tr '\n' ',')
          echo "clients=${CHANGED_CLIENTS}" >> $GITHUB_OUTPUT

      - name: Package theme ZIP
        run: |
          for CLIENT_DIR in front/ecommerce/*/; do
            CLIENT_NAME=$(basename "$CLIENT_DIR")
            if [ -d "${CLIENT_DIR}wp-content/themes" ]; then
              cd "${CLIENT_DIR}wp-content/themes"
              for THEME_DIR in */; do
                THEME_NAME=$(basename "$THEME_DIR")
                zip -r "../../../../${CLIENT_NAME}-${THEME_NAME}.zip" "$THEME_DIR" -x "*/node_modules/*" "*/.git/*"
              done
              cd -
            fi
          done

      - name: Package plugins ZIP
        run: |
          for CLIENT_DIR in front/ecommerce/*/; do
            CLIENT_NAME=$(basename "$CLIENT_DIR")
            if [ -d "${CLIENT_DIR}wp-content/plugins" ]; then
              cd "${CLIENT_DIR}wp-content/plugins"
              for PLUGIN_DIR in */; do
                PLUGIN_NAME=$(basename "$PLUGIN_DIR")
                zip -r "../../../../${CLIENT_NAME}-${PLUGIN_NAME}.zip" "$PLUGIN_DIR" -x "*/node_modules/*" "*/.git/*" "*/vendor/*"
              done
              cd -
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-packages
          path: '*.zip'
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: package
    environment: staging
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-packages

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          ssh_private_key: ${{ secrets.STAGING_SSH_KEY }}
          local_path: './*.zip'
          remote_path: ${{ secrets.STAGING_DEPLOY_PATH }}/releases/
          sftp_only: true

      - name: Extract and activate on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            RELEASE_DIR="releases/$(date +%Y%m%d%H%M%S)"
            mkdir -p "$RELEASE_DIR"
            
            # Extract theme and plugin ZIPs
            for ZIP in releases/*.zip; do
              unzip -o "$ZIP" -d "$RELEASE_DIR/"
            done
            
            # Sync to WordPress installation
            rsync -avz --delete "$RELEASE_DIR/" "${{ secrets.STAGING_WP_PATH }}/wp-content/"
            
            # Clear cache
            wp cache flush --path="${{ secrets.STAGING_WP_PATH }}" || true
            
            # Clean up old releases (keep last 5)
            cd releases && ls -dt */ | tail -n +6 | xargs rm -rf || true

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Wait for deployment to settle
        run: sleep 10

      - name: Check staging site responds
        run: |
          TIMEOUT=30
          START=$(date +%s)
          while true; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_URL }}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Staging site is healthy (HTTP 200)"
              exit 0
            fi
            
            ELAPSED=$(( $(date +%s) - START ))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "✗ Health check failed after ${TIMEOUT}s (last status: $STATUS)"
              exit 1
            fi
            
            echo "Waiting... (status: $STATUS, elapsed: ${ELAPSED}s)"
            sleep 5
          done

      - name: Check WooCommerce API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_URL }}/wp-json/wc/v3/system_status" -u "${{ secrets.STAGING_WC_KEY }}:${{ secrets.STAGING_WC_SECRET }}")
          if [ "$STATUS" = "200" ]; then
            echo "✓ WooCommerce API is responding"
          else
            echo "⚠ WooCommerce API returned $STATUS (non-critical)"
          fi

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [validate, package, deploy-staging, health-check]
    if: failure()
    steps:
      - name: Send failure notification
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "⚠️ Staging deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "⚠️ *Staging Deployment Failed*\n\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
