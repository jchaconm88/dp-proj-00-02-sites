<style>
/* Responsive navigation — hamburger menu for mobile < 768px */
/* WordPress core handles the overlay menu toggle via overlayMenu:"mobile" */
/* These styles ensure proper touch targets and transitions */

.site-header .wp-block-navigation__responsive-container-open,
.site-header .wp-block-navigation__responsive-container-close {
	min-width: 44px;
	min-height: 44px;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 8px;
	cursor: pointer;
}

.site-header .wp-block-navigation__responsive-container {
	transition: transform 300ms ease-in-out, opacity 300ms ease-in-out;
}

.site-header .wp-block-navigation__responsive-container.is-menu-open {
	transform: translateX(0);
	opacity: 1;
}

.site-header .wp-block-navigation__responsive-container:not(.is-menu-open) {
	transform: translateX(100%);
	opacity: 0;
}

/* Ensure all interactive elements meet 44x44px minimum touch target */
.site-header .wp-block-navigation-item__content,
.site-header .wp-block-navigation__responsive-container-open,
.site-header .wp-block-navigation__responsive-container-close,
.site-header .wc-block-mini-cart__button {
	min-width: 44px;
	min-height: 44px;
	display: inline-flex;
	align-items: center;
}

/* Mobile-first: navigation links stacked on mobile */
@media (max-width: 767px) {
	.site-header .header-navigation-group {
		width: 100%;
		justify-content: flex-end;
	}
}

/* Tablet and above: navigation inline */
@media (min-width: 768px) {
	.site-header .wp-block-navigation__responsive-container-open {
		display: none;
	}
}
</style>
<!-- /wp:html -->
